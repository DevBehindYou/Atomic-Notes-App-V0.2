<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
  body { width: 340px; height: 720px; overflow: hidden; }
  .phone { position: absolute; left: 8px; top: 8px; width: 316px; }
</style></head>
<body>
<div class="phone"><div class="screen"><img id="s"></div></div>
<script>
  const q = new URLSearchParams(location.search);
  // Screens live in ../screens: release 2.03.5 cuts from the iPhone 18 Pro mockups (no device frame, because
  // the app is Android-only) and a few August 2026 screens that have no newer mockup yet.
  document.getElementById('s').src = "../screens/" + q.get('s') + ".png";
  if (q.get('ink')) document.querySelector('.phone').classList.add('inkshadow');
</script>
</body></html>
